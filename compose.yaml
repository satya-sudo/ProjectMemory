name: projectmap

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: projectmap
      POSTGRES_PASSWORD: ${PROJECTMAP_POSTGRES_PASSWORD:-projectmap_local}
      POSTGRES_DB: projectmap
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectmap -d projectmap"]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 10s

volumes:
  postgres_data:
